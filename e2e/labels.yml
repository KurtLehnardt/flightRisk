# E2E test labels for GitHub issues
labels:
  - name: "platform: android"
    description: "Android platform"
    color: "3DDC84"
  - name: "platform: ios"
    description: "iOS platform"
    color: "555555"
  - name: "source: e2e"
    description: "Issue filed from E2E test run"
    color: "0075ca"
  - name: "e2e: flaky"
    description: "Flaky E2E test"
    color: "fbca04"
  - name: "area: release"
    description: "Issue only in release build"
    color: "d4c5f9"
  - name: "needs decision"
    description: "Needs owner decision"
    color: "d4c5f9"
