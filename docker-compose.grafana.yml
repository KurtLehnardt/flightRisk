# Grafana observability stack for FlightRisk.
#
#   app --OTLP--> otel-collector --> Tempo      (traces)
#                                --> Prometheus (metrics)
#                                --> Loki       (logs)
#                                        \--> Grafana (dashboard "FlightRisk")
#
# Usage:
#   docker compose -f docker-compose.grafana.yml up -d
#   # then run the app with:
#   #   FLIGHTRISK_OTEL_ENABLED=true OTEL_EXPORTER=otlp-grpc OTEL_ENDPOINT=http://localhost:4317
#   # Grafana: http://localhost:3000  (login: admin / $GRAFANA_ADMIN_PASSWORD, default "admin")
#
# The collector uses host ports 4317/4318, the same as Jaeger in
# docker-compose.otel.yml, so run one or the other, not both.
# All ports bind to loopback only: telemetry from a search operation should
# not be reachable from the network. The one exception is opt-in: with
# OTLP_BIND=10.42.0.1 the OTLP ports listen on the Thunderbolt cable address
# so a second laptop can export to this stack (observability/README.md).
# Before using OTLP_BIND, run scripts/check_otlp_bind.sh: it rejects any value
# other than 127.0.0.1 or 10.42.0.1 (the OTLP receiver has no authentication).
# See observability/README.md for details.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # Loopback by default. For a second node on the Thunderbolt cable set
      # OTLP_BIND=10.42.0.1 (the cable address only, never 0.0.0.0).
      - "${OTLP_BIND:-127.0.0.1}:4317:4317"   # OTLP gRPC
      - "${OTLP_BIND:-127.0.0.1}:4318:4318"   # OTLP HTTP
    depends_on:
      - tempo
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      # Keep exemplars (trace ids on histogram samples) for metric -> trace links.
      - --enable-feature=exemplar-storage
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    # No depends_on the collector: Prometheus scrapes it with retries, and a
    # collector that cannot bind OTLP_BIND must not stop Prometheus or Grafana.
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    # expand-env lets LOKI_RETENTION_PERIOD (default 168h, 7 days) set the log retention.
    command: ["-config.file=/etc/loki/config.yaml", "-config.expand-env=true"]
    environment:
      - LOKI_RETENTION_PERIOD=${LOKI_RETENTION_PERIOD:-168h}
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/flightrisk-overview.json
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Alert rules, contact point and notification policy as code.
      - ./observability/grafana/alerting:/etc/grafana/provisioning/alerting:ro
      - grafana_data:/var/lib/grafana
    ports:
      # GRAFANA_PORT moves Grafana off 3000 when something else uses it.
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    # No depends_on: the data sources are reachable by name once they are up,
    # and Grafana must start even if the collector could not bind OTLP_BIND.
    restart: unless-stopped

volumes:
  prometheus_data:
  tempo_data:
  loki_data:
  grafana_data:
