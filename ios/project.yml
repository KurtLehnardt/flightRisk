name: FlightRisk
options:
  bundleIdPrefix: com.flightrisk
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: FlightRisk/Info.plist
    DEVELOPMENT_TEAM: ""
targets:
  FlightRisk:
    type: application
    platform: iOS
    sources:
      - FlightRisk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flightrisk.app
        INFOPLIST_FILE: FlightRisk/Info.plist
        CODE_SIGN_STYLE: Automatic
    info:
      path: FlightRisk/Info.plist
      properties:
        CFBundleDisplayName: FlightRisk
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "FlightRisk uses your camera to scan for people matching the target photo."
        NSLocationWhenInUseUsageDescription: "FlightRisk attaches GPS coordinates to match alerts so you can navigate to the location."
        NSLocalNetworkUsageDescription: "FlightRisk connects to the Tello drone over your local WiFi network."
        NSPhotoLibraryUsageDescription: "FlightRisk needs access to your photo library to select a target reference photo."
