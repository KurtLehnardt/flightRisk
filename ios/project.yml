name: FlightRisk
options:
  bundleIdPrefix: com.flightrisk
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
packages:
  MLX:
    url: https://github.com/ml-explore/mlx-swift
    from: "0.29.1"
  MLXSwiftExamples:
    url: https://github.com/ml-explore/mlx-swift-examples
    from: "2.29.1"
  FlightRiskGround:
    path: FlightRiskGround
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: FlightRisk/Info.plist
    # The privacy policy the onboarding notice links to. It is written into Info.plist as
    # FlightRiskPrivacyPolicyURL. Set it here, or in Config/Signing.local.xcconfig, once the
    # policy is hosted. DEVELOPMENT_TEAM is not set here: it comes from Config/Signing.xcconfig.
    FLIGHTRISK_PRIVACY_POLICY_URL: https://github.com/KurtLehnardt/flightRisk/blob/main/docs/privacy-policy.md
    # The build number (CFBundleVersion). Raise it for every App Store Connect upload; see
    # ios/README.md, "Build number".
    CURRENT_PROJECT_VERSION: "1"
targets:
  FlightRisk:
    type: application
    platform: iOS
    # FlightRisk/Models holds the models scripts/mobile_models/make_models.py installs
    # (gitignored, never committed). It is not a source folder: Xcode fails a build whose
    # sources include a missing file, so the "Core ML models (optional)" phase below compiles
    # the packages when they are there instead.
    sources:
      - path: FlightRisk
        excludes:
          - Models/**
    dependencies:
      - package: MLX
      - package: MLXSwiftExamples
        product: MLXLLM
      - package: MLXSwiftExamples
        product: MLXLMCommon
      - package: FlightRiskGround
        product: GroundProtocol
      - package: FlightRiskGround
        product: SocketIOMini
      - package: FlightRiskGround
        product: PersonVision
      - package: FlightRiskGround
        product: MissionCore
      - package: FlightRiskGround
        product: DroneLinks
      - package: FlightRiskGround
        product: MissionUI
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    # The licence guard (scripts/mobile_models/licence_guard.py, Python 3.9+ standard
    # library only) checks the built app in every Release build, including archives:
    # only the Core ML models scripts/mobile_models/make_models.py converted (pinned
    # weights digest in their metadata) may be in it, and no known forbidden model under
    # any name. Any finding, or a guard that cannot run, fails the build. Debug builds
    # are not checked. The phase reads the whole app folder, so it runs outside the
    # user script sandbox (ENABLE_USER_SCRIPT_SANDBOXING below) and on every build.
    postBuildScripts:
      # The installed models are optional: a checkout without them builds, and the Search tab
      # then shows "Person detection unavailable". When FlightRisk/Models holds them, this
      # compiles YOLOXs.mlpackage and CLIPViTB16LAION.mlpackage into the app (as Xcode would
      # compile a model in the sources; the compiled models keep their metadata, which the
      # licence guard checks) and copies mobile-models.json and model-notices.md beside them.
      # Models from an earlier build are removed first, so a removed model never lingers.
      - name: Core ML models (optional)
        shell: /bin/sh
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          MODELS="$SRCROOT/FlightRisk/Models"
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$DEST"
          missing=""
          for name in YOLOXs CLIPViTB16LAION; do
            rm -rf "$DEST/$name.mlmodelc"
            if [ -d "$MODELS/$name.mlpackage" ]; then
              xcrun coremlc compile "$MODELS/$name.mlpackage" "$DEST" \
                --deployment-target "$IPHONEOS_DEPLOYMENT_TARGET" --sdkroot "$SDKROOT" \
                --platform ios --container bundle-resources
            else
              missing="$missing $name.mlpackage"
            fi
          done
          for file in mobile-models.json model-notices.md; do
            rm -f "$DEST/$file"
            if [ -f "$MODELS/$file" ]; then cp "$MODELS/$file" "$DEST/$file"; else missing="$missing $file"; fi
          done
          if [ -n "$missing" ]; then
            if [ "$CONFIGURATION" = "Release" ] && [ "${FLIGHTRISK_ALLOW_RELEASE_WITHOUT_MODELS:-}" != "YES" ]; then
              echo "error: this Release build is missing these files in ios/FlightRisk/Models:$missing. A store build needs both model packages, mobile-models.json and model-notices.md. Install them with scripts/mobile_models/make_models.py install (see docs/mobile-models.md). CI builds without models may set FLIGHTRISK_ALLOW_RELEASE_WITHOUT_MODELS=YES as a build setting; store builds must not."
              exit 1
            fi
            echo "warning: these files are not in ios/FlightRisk/Models, so this build is incomplete or has no models:$missing (see docs/mobile-models.md)"
          fi
        outputPaths:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/YOLOXs.mlmodelc
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/CLIPViTB16LAION.mlmodelc
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/mobile-models.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/model-notices.md
      - name: Licence guard (Release)
        shell: /bin/sh
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/../scripts/mobile_models/licence_guard.py
          - $(TARGET_BUILD_DIR)/$(WRAPPER_NAME)
        script: |
          if [ "$CONFIGURATION" != "Release" ]; then
            echo "licence guard: skipped for the $CONFIGURATION configuration"
            exit 0
          fi
          exec /usr/bin/python3 "$SRCROOT/../scripts/mobile_models/licence_guard.py" "$TARGET_BUILD_DIR/$WRAPPER_NAME"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flightrisk.app
        INFOPLIST_FILE: FlightRisk/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # iPhone only. XcodeGen's iOS target preset sets "1,2", which would override the
        # project-level value, so the target sets it again.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: FlightRisk/Info.plist
      properties:
        CFBundleDisplayName: FlightRisk
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        FlightRiskPrivacyPolicyURL: "$(FLIGHTRISK_PRIVACY_POLICY_URL)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: "FlightRisk uses your camera to take the target photo."
        NSLocationWhenInUseUsageDescription: "FlightRisk attaches GPS coordinates to match alerts so you can navigate to the location."
        NSLocalNetworkUsageDescription: "FlightRisk connects to the ground station address you enter in Settings, over your local network, to show its status and send commands."
        NSPhotoLibraryUsageDescription: "FlightRisk needs access to your photo library to select a target reference photo."
  FlightRiskTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FlightRiskTests
    dependencies:
      - target: FlightRisk
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        INFOPLIST_FILE: FlightRiskTests/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
  FlightRiskUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - FlightRiskUITests
    dependencies:
      - target: FlightRisk
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FlightRisk
        TARGETED_DEVICE_FAMILY: "1"
