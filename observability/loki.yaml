# Single-binary Loki with local filesystem storage (dev / field-test use).
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Required for OTLP ingest (resource/log attributes become structured metadata).
  allow_structured_metadata: true
  # Logs older than this are deleted by the compactor. Default 7 days; set
  # LOKI_RETENTION_PERIOD (for example 72h) before `docker compose up` to change
  # it (Loki runs with -config.expand-env=true).
  retention_period: ${LOKI_RETENTION_PERIOD:-168h}

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  compaction_interval: 10m
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
