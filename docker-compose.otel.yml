version: '3.8'
services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "${OTLP_BIND:-127.0.0.1}:16686:16686"  # Jaeger UI
      - "${OTLP_BIND:-127.0.0.1}:4317:4317"    # OTLP gRPC
      - "${OTLP_BIND:-127.0.0.1}:4318:4318"    # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
