[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short -m "not sitl and not slow"
markers =
    integration: tests requiring ML models (may be slow)
    e2e: end-to-end dashboard tests
    regression: edge case regression tests
    sitl: tests requiring a running ArduPilot SITL instance (see scripts/start_sitl.sh)
    slow: long chaos and soak runs against the fleet (run with -m slow; see docs/testing-fleet.md)
